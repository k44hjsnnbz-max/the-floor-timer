<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>THE FLOOR TIMER</title>
<style>
html,body{margin:0;height:100%;background:#080808;color:white;font-family:Arial,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
h1{text-align:center;font-size:42px;margin:18px 0 10px;font-weight:900}
#players{display:flex;gap:12px;flex:1;padding:12px}
.card{flex:1;border:4px solid #444;border-radius:24px;background:#151515;display:flex;flex-direction:column;align-items:center;justify-content:center}
.active{border-color:white}
.label{font-size:28px;font-weight:bold}
.clock{font-size:clamp(70px,14vw,150px);font-weight:900;font-variant-numeric:tabular-nums}
#controls{padding:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button{font-size:22px;font-weight:bold;padding:16px 24px;border:0;border-radius:16px;background:#333;color:white}
#swap{background:white;color:black;min-width:230px}
@media(max-width:600px){h1{font-size:30px}.label{font-size:20px}.clock{font-size:70px}button{font-size:17px;padding:13px 17px}}
</style>
</head>
<body>
<h1>THE FLOOR</h1>
<div id="players">
<div class="card active" id="a"><div class="label">PLAYER A</div><div class="clock" id="ta">45.0</div></div>
<div class="card" id="b"><div class="label">PLAYER B</div><div class="clock" id="tb">45.0</div></div>
</div>
<div id="controls">
<button id="swap">BUZZ / SWAP ↔</button>
<button id="pause">START</button>
<button id="reset">RESET</button>
</div>
<script>
var t=[45,45], who=0, running=false, last=0, timer=null;
function draw(){
 document.getElementById('ta').textContent=t[0].toFixed(1);
 document.getElementById('tb').textContent=t[1].toFixed(1);
 document.getElementById('a').className='card'+(who===0?' active':'');
 document.getElementById('b').className='card'+(who===1?' active':'');
 document.getElementById('pause').textContent=running?'PAUSE':'START';
}
function loop(){
 if(!running)return;
 var now=Date.now();
 t[who]-=(now-last)/1000; last=now;
 if(t[who]<=0){t[who]=0;running=false;}
 draw();
 if(running)timer=setTimeout(loop,50);
}
function start(){running=true;last=Date.now();loop();}
document.getElementById('swap').onclick=function(){
 if(!running){start();return}
 who=1-who;last=Date.now();draw();
};
document.getElementById('pause').onclick=function(){
 if(running){running=false;draw()}else start();
};
document.getElementById('reset').onclick=function(){t=[45,45];who=0;running=false;draw()};
draw();
</script>
</body>
</html>
